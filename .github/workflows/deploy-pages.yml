name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Base path beállítás
        id: base
        run: echo "path=/" >> "$GITHUB_OUTPUT"

      - name: Függőségek telepítése
        run: bun install --frozen-lockfile || bun install

      - name: Build
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}
        run: bun run build

      - name: Kliens kimeneti mappa megkeresése
        id: client
        run: |
          # Először megkeressük a pontos mappát, ahol az index.html lapul
          INDEX_PATH=$(find . -name "index.html" -not -path "*/node_modules/*" | head -n 1)
          
          if [ -z "$INDEX_PATH" ]; then
            echo "X Nem található index.html a build után!" >&2
            exit 1
          fi

          # Kiszedjük a mappa útvonalát a fájlnévből
          TARGET_DIR=$(dirname "$INDEX_PATH")
          echo "Megtalált kimeneti mappa: $TARGET_DIR"

          echo "ujmatrix.hu" > "$TARGET_DIR/CNAME"
          cp "$TARGET_DIR/index.html" "$TARGET_DIR/404.html"
          echo "path=$TARGET_DIR" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v5

      - name: Deploy artifact feltöltése
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.client.outputs.path }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
