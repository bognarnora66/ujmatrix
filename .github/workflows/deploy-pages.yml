name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Repo-név alapú base path kiszámítása
        id: base
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER_LOWER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          REPO_LOWER=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')
          if [ "$REPO_LOWER" = "$OWNER_LOWER.github.io" ]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$REPO/" >> "$GITHUB_OUTPUT"
          fi

      - name: Függőségek telepítése
        run: bun install --frozen-lockfile || bun install

      - name: Build
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}
        run: bun run build

# - name: Statikus oldalak előrenderelése
#   env:
#     BASE_PATH: ${{ steps.base.outputs.path }}
#   run: node scripts/prerender-pages.mjs

#      - name: Kliens kimeneti mappa megkeresése
#        id: client
#        run: |
#          for dir in dist/client .output/public dist; do
#            if [ -f "$dir/index.html" ]; then
#              echo "path=$dir" >> "$GITHUB_OUTPUT"
#              echo "Kliens kimenet: $dir"
#              exit 0
#            fi
#          done
#          echo "✗ Nem találom a kliens kimenetet (index.html)!" >&2
#          exit 1
      - uses: actions/configure-pages@v5
      - name: Deploy artifact feltöltése
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

#     - uses: actions/upload-pages-artifact@v3
#       with:
#         path: ${{ steps.client.outputs.path }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
