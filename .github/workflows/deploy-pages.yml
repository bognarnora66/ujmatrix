name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Base path beállítás
        id: base
        run: echo "path=/" >> "$GITHUB_OUTPUT"

      - name: Függőségek telepítése
        run: bun install --frozen-lockfile || bun install

      - name: Build
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}
        run: bun run build

      - name: Kliens kimeneti mappa megkeresése
        id: client
        run: |
          echo "=== Generált fájlok és mappák ==="
          find . -maxdepth 4 -not -path "*/node_modules/*" -not -path "*/.git/*"

          TARGET_DIR=""
          if [ -d ".output/public" ]; then
            TARGET_DIR=".output/public"
          elif [ -d "dist/client" ]; then
            TARGET_DIR="dist/client"
          elif [ -d "dist" ]; then
            TARGET_DIR="dist"
          else
            TARGET_DIR=$(find . -type d \( -name "public" -o -name "client" \) -not -path "*/node_modules/*" -not -path "*/.git/*" | head -n 1)
          fi

          if [ -z "$TARGET_DIR" ]; then
            echo "X Nem található kimeneti mappa!" >&2
            exit 1
          fi

          echo "Megtalált kimeneti mappa: $TARGET_DIR"
          echo "ujmatrix.hu" > "$TARGET_DIR/CNAME"
          
          if [ -f "$TARGET_DIR/index.html" ]; then
            cp "$TARGET_DIR/index.html" "$TARGET_DIR/404.html"
          fi

          echo "path=$TARGET_DIR" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v5

      - name: Deploy artifact feltöltése
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.client.outputs.path }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
