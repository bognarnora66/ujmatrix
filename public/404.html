<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ÚjMátrix — Légzésterápia és Coaching | Bognár Eleonóra</title>
    <meta name="description" content="Légzésterapeuta Budapesten. Stresszoldás, transzlégzés, coaching — visszatalálni önmagadhoz." />
    <script>
      // GitHub Pages SPA fallback: preserve the requested path so the client router can render it.
      (function () {
        var location = window.location;
        var pathname = location.pathname;
        if (pathname !== "/" && !pathname.startsWith("/index.html")) {
          var params = new URLSearchParams(location.search);
          params.set("redirect", pathname + location.search + location.hash);
          location.replace("/?" + params.toString());
        }
      })();
    </script>
  </head>
  <body>
    <noscript>Az oldal megtekintéséhez JavaScript szükséges.</noscript>
    <div id="app"></div>
  </body>
</html>
